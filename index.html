<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Snack That Smiles Back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ====== EDIT YOUR COPY IN THE HTML BELOW (marked with comments) ====== */
  :root{
    --orange:#F58220;
    --orange-deep:#D9650A;
    --cheddar:#FBB040;
    --cream:#FFF3DD;
    --ink:#5A2E00;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'Fredoka',sans-serif;
    background:radial-gradient(120% 80% at 50% -10%, var(--cheddar), var(--orange) 55%, var(--orange-deep) 100%);
    color:var(--cream);user-select:none;position:relative;
  }
  #stage{position:fixed;inset:0;overflow:hidden;cursor:pointer;
    background-image:radial-gradient(rgba(255,255,255,.10) 1.5px, transparent 1.5px);
    background-size:26px 26px;}

  #hud{position:absolute;top:0;left:0;right:0;padding:38px 22px 0;text-align:center;z-index:6;pointer-events:none;}
  #hud h1{font-family:'Baloo 2',cursive;font-weight:800;font-size:clamp(32px,9.5vw,56px);
    line-height:.95;letter-spacing:-.5px;color:var(--cream);
    text-shadow:0 3px 0 var(--orange-deep),0 8px 22px rgba(0,0,0,.22);}
  #hud .tag{font-weight:600;font-size:clamp(15px,4.6vw,20px);margin-top:8px;opacity:.95;
    text-shadow:0 2px 5px rgba(0,0,0,.25);}

  #count{position:absolute;top:30px;right:18px;z-index:7;pointer-events:none;
    background:rgba(90,46,0,.35);border:1.5px solid rgba(255,255,255,.35);
    border-radius:14px;padding:7px 12px;font-weight:600;font-size:13px;}
  #count b{color:#fff;font-size:17px;}

  #prompt{position:absolute;left:50%;bottom:26%;transform:translateX(-50%);z-index:6;
    text-align:center;pointer-events:none;transition:opacity .35s;}
  #prompt .pill{display:inline-block;background:var(--cream);color:var(--orange-deep);
    font-weight:700;font-size:16px;padding:12px 22px;border-radius:999px;
    box-shadow:0 6px 0 rgba(0,0,0,.18);animation:bob 1.5s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  .cracker{position:absolute;z-index:4;will-change:transform;top:0;left:0;}
  .cracker svg{display:block;filter:drop-shadow(0 4px 6px rgba(120,55,0,.3));}

  /* the bag you tap */
  #bag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);z-index:8;
    width:min(56vw,240px);pointer-events:none;transform-origin:50% 100%;}
  #bag .squeeze{transform-origin:50% 100%;transition:transform .14s cubic-bezier(.34,1.56,.64,1);}
  #stage.press #bag .squeeze{transform:scaleX(1.08) scaleY(.9);}

  #reveal{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    padding:26px;background:rgba(120,55,0,.72);backdrop-filter:blur(7px);
    opacity:0;pointer-events:none;transition:opacity .45s;}
  #reveal.show{opacity:1;pointer-events:auto;}
  #card{background:var(--cream);color:var(--ink);border-radius:26px;padding:32px 26px;
    max-width:340px;width:100%;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.4);
    transform:translateY(18px) scale(.96);transition:transform .5s cubic-bezier(.2,1.3,.4,1);}
  #reveal.show #card{transform:translateY(0) scale(1);}
  #card .face{width:74px;height:52px;margin:0 auto 8px;animation:wiggle 2.2s ease-in-out infinite;}
  @keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  #card h2{font-family:'Baloo 2',cursive;font-weight:800;font-size:25px;color:var(--orange-deep);margin:4px 0 8px;}
  #card p{font-size:16px;line-height:1.45;font-weight:500;}
  #card .code{margin:16px auto 4px;display:inline-block;border:2.5px dashed var(--orange);
    border-radius:14px;padding:10px 20px;font-family:'Baloo 2',cursive;font-weight:800;
    font-size:22px;letter-spacing:2px;color:var(--orange-deep);}
  #card a{display:inline-block;margin-top:16px;background:var(--orange);color:#fff;font-weight:700;
    text-decoration:none;font-size:16px;padding:13px 26px;border-radius:999px;box-shadow:0 6px 0 var(--orange-deep);}
  #card a:active{transform:translateY(3px);box-shadow:0 3px 0 var(--orange-deep);}
  #card small{display:block;margin-top:13px;opacity:.5;font-size:12px;}
</style>
</head>
<body>
<div id="stage">
  <div id="hud">
    <!-- ====== EDIT HEADLINE ====== -->
    <h1>THE SNACK<br>THAT SMILES BACK</h1>
    <!-- ====== EDIT SUBHEAD ====== -->
    <div class="tag">tap the bag &amp; pour some out</div>
  </div>

  <div id="count">Poured <b id="num">0</b></div>
  <div id="prompt"><span class="pill">👇 Tap the bag</span></div>

  <div id="bag">
    <svg viewBox="0 0 200 150" width="100%">
      <g class="squeeze">
        <path d="M18 150 L8 34 Q100 12 192 34 L182 150 Z" fill="#E94E1B"/>
        <path d="M18 150 L8 34 Q100 12 192 34 L182 150 Z" fill="url(#sheen)" opacity=".25"/>
        <rect x="8" y="22" width="184" height="16" rx="4" fill="#C53C12"/>
        <text x="100" y="92" font-family="Baloo 2, sans-serif" font-weight="800" font-size="30"
              fill="#FFF3DD" text-anchor="middle" letter-spacing="1">SNACKS</text>
      </g>
      <defs>
        <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      </defs>
    </svg>
  </div>

  <div id="reveal">
    <div id="card">
      <div class="face"><svg viewBox="0 0 100 70" width="74"><use href="#crackerShape"/></svg></div>
      <!-- ====== EDIT PAYOFF ====== -->
      <h2>Show this to us 👋</h2>
      <p>Flash this screen at the table and grab a free handful, fresh out of the bag.</p>
      <div class="code">SMILE&nbsp;5</div>
      <!-- ====== IG link is set below ====== -->
      <a href="https://www.instagram.com/goldfishsmiles/" target="_blank" rel="noopener">Follow @goldfishsmiles ↗</a>
      <small>tap outside to keep pouring</small>
    </div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute"><defs>
  <g id="crackerShape">
    <path d="M22 35 L4 12 Q18 35 4 58 Z" fill="#E8740E"/>
    <ellipse cx="56" cy="35" rx="42" ry="27" fill="#F7941E"/>
    <ellipse cx="56" cy="29" rx="42" ry="16" fill="#FBB040" opacity=".55"/>
    <circle cx="72" cy="27" r="4.2" fill="#5A2E00"/>
    <path d="M58 40 Q72 52 86 40" stroke="#5A2E00" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</defs></svg>

<script>
const stage=document.getElementById('stage');
const reveal=document.getElementById('reveal');
const prompt=document.getElementById('prompt');
const numEl=document.getElementById('num');
const W=()=>innerWidth, H=()=>innerHeight;

const crackers=[];
let poured=0, revealed=false;
const colW=38;                  // pile column width
const colH={};                  // resting height per column

function bagMouth(){
  // pour from the opening near the top of the bag
  const bagW=Math.min(W()*0.56,240);
  const bagH=bagW*150/200;
  return {x:W()/2, y:H()-bagH+24};
}

function spawnCracker(){
  const el=document.createElement('div');
  el.className='cracker';
  el.innerHTML='<svg width="56" height="39" viewBox="0 0 100 70"><use href="#crackerShape"/></svg>';
  stage.appendChild(el);
  const m=bagMouth();
  const c={
    el,
    x:m.x+(Math.random()*40-20),
    y:m.y,
    vx:(Math.random()*5-2.5),
    vy:-(7+Math.random()*4),          // burst upward out of the bag
    rot:Math.random()*360,
    vr:(Math.random()*6-3),
    sx:0.4, sy:0.4,                    // pop-in
    rest:Math.random()*30-15,         // natural resting tilt
    squash:0,
    settled:false,
    born:performance.now()
  };
  crackers.push(c);
  poured++; numEl.textContent=poured;
  if(!revealed && poured>=12){revealed=true;reveal.classList.add('show');}
}

function pour(){
  prompt.style.opacity='0';
  stage.classList.add('press');
  setTimeout(()=>stage.classList.remove('press'),140);
  const n=4+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++) setTimeout(spawnCracker,i*55);
}
stage.addEventListener('pointerdown',()=>{ if(!reveal.classList.contains('show')) pour(); });
reveal.addEventListener('pointerdown',e=>{ if(e.target===reveal) reveal.classList.remove('show'); });

function step(){
  const floorY=H()-12;
  for(const c of crackers){
    // pop-in grow
    if(c.sx<1){ c.sx+=0.12; c.sy+=0.12; if(c.sx>1)c.sx=c.sy=1; }
    // squash decay
    if(c.squash>0.01){ c.squash*=0.8; } else c.squash=0;

    if(!c.settled){
      c.vy+=0.55;                       // gravity
      if(c.vy>16)c.vy=16;
      c.vx*=0.992;
      c.x+=c.vx; c.y+=c.vy; c.rot+=c.vr;
      // side walls
      if(c.x<24){c.x=24;c.vx=Math.abs(c.vx)*.55;c.vr*=.6;}
      if(c.x>W()-24){c.x=W()-24;c.vx=-Math.abs(c.vx)*.55;c.vr*=.6;}
      // land on the growing pile
      const col=Math.max(0,Math.floor(c.x/colW));
      const restY=floorY-(colH[col]||0)-18;
      if(c.y>=restY){
        c.y=restY;
        if(Math.abs(c.vy)<3.2){
          c.settled=true;
          c.vr=0;
          c.squash=1;                    // squash on landing
          c.rot=c.rest;                  // ease toward a natural resting angle
          colH[col]=(colH[col]||0)+15;
        }else{
          c.vy*=-0.34; c.vx*=0.65; c.vr*=0.5;   // small bounce
        }
      }
    }else{
      // gently relax rotation to resting tilt
      c.rot+=(c.rest-c.rot)*0.2;
    }
    const sx=c.sx*(1+0.22*c.squash);
    const sy=c.sy*(1-0.3*c.squash);
    c.el.style.transform=`translate(${c.x-28}px,${c.y-20}px) rotate(${c.rot}deg) scale(${sx},${sy})`;
  }
  // retire oldest so pile never overflows the screen
  if(crackers.length>120){ crackers.shift().el.remove(); }
  requestAnimationFrame(step);
}
step();
</script>
</body>
</html>
